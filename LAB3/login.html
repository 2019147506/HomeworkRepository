<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Info Login</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="page-wrap">
    <header class="site-header">
      <div class="header-animation-box">
        <h1 class="sliding-title">로그인 페이지입니다.</h1>
      </div>

      <nav class="main-nav">
        <a href="index.html">메인페이지</a>
        <a href="login.html" class="active">로그인</a>
        <a href="signup.html">회원가입</a>
      </nav>
    </header>

    <main class="content-shell form-shell">
      <section class="form-section">
        <h2>Login</h2>

        <form action="#" method="post" class="user-form">
          <div class="form-row">
            <label for="login-id">아이디</label>
            <input type="text" id="login-id" name="userid" placeholder="아이디 입력">
          </div>

          <div class="form-row">
            <label for="login-password">비밀번호</label>
            <input type="password" id="login-password" name="password" placeholder="비밀번호 입력">
          </div>

          <div class="form-buttons">
            <button type="submit">로그인</button>
            <button type="reset">초기화</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
